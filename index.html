<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>椅子の数カルキュレーター</title>
<style>
:root{--bg:#f6f5f1;--fg:#222;--card:#fff;--line:#d8d5cc;--acc:#2b6cb0;--tbl:#c9a66b;--chair:#6b8fb8;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--fg:#e8e8e8;--card:#26282c;--line:#3a3d43;--acc:#6fa8e8;--tbl:#8a6d3b;--chair:#5b84b0;--mut:#999}}
:root[data-theme="dark"]{--bg:#1b1c1f;--fg:#e8e8e8;--card:#26282c;--line:#3a3d43;--acc:#6fa8e8;--tbl:#8a6d3b;--chair:#5b84b0;--mut:#999}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 16px}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mut)}
input[type=number],select{width:100%;box-sizing:border-box;margin-top:4px;padding:8px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.sides,.seg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.sides label,.seg label{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:.95rem}
.total{font-size:2.6rem;font-weight:700;color:var(--acc);line-height:1}
.total small{font-size:1rem;font-weight:400;color:var(--mut);margin-left:6px}
.detail{color:var(--mut);font-size:.9rem;margin-top:8px}
svg{width:100%;height:auto;display:block}
.trow{border-top:1px solid var(--line);padding:10px 0}
.trow:first-of-type{border-top:0}
.trow .grid{grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.thead{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin-bottom:4px}
button{font-size:.9rem;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.bar select{width:auto;margin:0}
</style>
</head>
<body>
<main>
<h1>椅子の数カルキュレーター</h1>

<div class="card">
  <h2>テーブルの配置</h2>
  <div id="tables"></div>
  <div class="bar">
    <button class="pri" id="add">＋ テーブルを追加</button>
    <select id="preset">
      <option value="">配置プリセット…</option>
      <option value="one">1台</option>
      <option value="row2">横に2台並べる</option>
      <option value="col2">縦に2台並べる</option>
      <option value="island">島型（4台）</option>
    </select>
  </div>
  <div class="detail">座標は各テーブルの左上（m）。回転は90°で縦横を入れ替えます。図のテーブルをクリックで選択すると、矢印キーかボタンで移動できます。</div>
  <div class="bar" id="tpad"><button data-mv="L">←</button><button data-mv="U">↑</button><button data-mv="D">↓</button><button data-mv="R">→</button>
    <label style="display:flex;align-items:center;gap:6px;color:var(--fg);font-size:.85rem">移動幅<select id="step2" style="width:auto;margin:0"><option>0.01</option><option selected>0.05</option><option>0.1</option></select></label></div>
</div>

<div class="card">
  <div class="grid">
    <label>椅子どうしの間隔<input type="number" id="gap" value="0" step="0.05" min="0"></label>
    <label>食い込み比率（0〜1）<input type="number" id="tuck" value="0" step="0.05" min="0" max="1"></label>
    <label style="display:flex;align-items:center;gap:6px;color:var(--fg);font-size:.95rem;margin-top:22px"><input type="checkbox" id="seethru">食い込みを透過表示</label>
    <label id="cl"><span id="cll">椅子の一辺</span><input type="number" id="cs" value="0.5" step="0.05" min="0.05"></label>
  </div>
  <div class="seg">
    <label><input type="radio" name="mode" value="abs" checked>椅子のサイズを直接入力</label>
    <label><input type="radio" name="mode" value="ratio">1台目の幅（短辺）との比率</label>
  </div>
  <div class="seg" style="margin:14px 0 12px">
    <label><input type="radio" name="place" value="auto" checked>自動配置</label>
    <label><input type="radio" name="place" value="manual">手動配置（選択して矢印キーで移動）</label>
  </div>
  <div id="manualbar" style="display:none;margin-bottom:14px">
    <div class="bar" style="margin-top:0">
      <button id="imp">自動配置を取り込む</button><button id="addc">椅子を追加</button><button id="delc">選択を削除</button>
      <label style="display:flex;align-items:center;gap:6px;color:var(--fg)">移動幅<select id="step" style="width:auto;margin:0"><option>0.01</option><option selected>0.05</option><option>0.1</option></select></label>
    </div>
    <div class="bar" id="csz" style="display:none;align-items:center"><span style="font-size:.9rem">選択中の椅子</span><label style="display:flex;gap:6px;align-items:center;color:var(--fg);font-size:.85rem">幅<input type="number" id="cw" step="0.05" min="0.05" style="width:80px;margin:0"></label><label style="display:flex;gap:6px;align-items:center;color:var(--fg);font-size:.85rem">高さ<input type="number" id="ch" step="0.05" min="0.05" style="width:80px;margin:0"></label><button id="crs">全体サイズに戻す</button></div>
    <div class="bar"><button data-mv="L">←</button><button data-mv="U">↑</button><button data-mv="D">↓</button><button data-mv="R">→</button></div>
  </div>
  <div style="margin-top:14px;font-size:.85rem;color:var(--mut)">椅子を置く辺（自動配置・各テーブル共通）
    <div class="sides">
      <label><input type="checkbox" id="s1" checked>上</label>
      <label><input type="checkbox" id="s2" checked>下</label>
      <label><input type="checkbox" id="s3">左</label>
      <label><input type="checkbox" id="s4">右</label>
    </div>
  </div>
</div>

<div class="card">
  <div class="total"><span id="tot">0</span><small>脚</small></div>
  <div class="detail" id="det"></div>
</div>

<div class="card">
  <h2>保存・読み込み（JSON）</h2>
  <textarea id="json" rows="6" placeholder="ここにJSONが表示されます。読み込むときはここに貼り付けてください" style="width:100%;box-sizing:border-box;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
  <div class="bar"><button id="jsave">現在の状態をJSON化</button><button id="jcopy">コピー</button><button id="jload">JSONを読み込む</button></div>
  <div class="detail" id="jmsg"></div>
  <div class="detail" id="amsg"></div>
  <div class="bar"><button id="aclr">保存データを消す</button></div>
</div>
<div class="card"><svg id="svg" viewBox="0 0 700 420" role="img" aria-label="配置図"></svg></div>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let T=[{w:0.6,l:1.7,x:0,y:0,r:0}];
  let M=[], sel=-1, selT=-1, manual=false;
  const E=1e-6;
  const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};

  function renderTables(){
    $('tables').innerHTML=T.map((t,i)=>
      '<div class="trow"><div class="thead"><b>テーブル '+(i+1)+'</b>'+
      (T.length>1?'<button data-del="'+i+'">削除</button>':'')+'</div><div class="grid">'+
      f(i,'w','幅(短辺)')+f(i,'l','長さ(長辺)')+f(i,'x','X')+f(i,'y','Y')+
      '<label>回転<select data-i="'+i+'" data-k="r"><option value="0"'+(t.r?'':' selected')+'>0°</option><option value="90"'+(t.r?' selected':'')+'>90°</option></select></label>'+
      '</div></div>').join('');
  }
  function f(i,k,name){return '<label>'+name+'<input type="number" step="0.05" data-i="'+i+'" data-k="'+k+'" value="'+T[i][k]+'"></label>'}

  $('tables').addEventListener('input',e=>{
    const el=e.target, i=el.dataset.i; if(i===undefined)return;
    T[i][el.dataset.k]=el.dataset.k==='r'?(el.value==='90'?90:0):num(el.value);
    update();
  });
  $('tables').addEventListener('click',e=>{
    const d=e.target.dataset.del; if(d===undefined)return;
    T.splice(+d,1); selT=-1; renderTables(); update();
  });
  $('add').onclick=()=>{
    const last=T[T.length-1], c=chairSize();
    const rx=Math.max(...T.map(t=>t.x+ext(t).dx));
    T.push({w:last.w,l:last.l,x:+(rx+2*c+0.2).toFixed(2),y:last.y,r:last.r});
    renderTables(); update();
  };
  $('preset').onchange=e=>{
    const v=e.target.value, w=T[0].w||0.6, l=T[0].l||1.7, c=chairSize(), g=+(c+0.1).toFixed(2);
    const mk=(x,y)=>({w,l,x:+x.toFixed(2),y:+y.toFixed(2),r:0});
    if(v==='one')T=[mk(0,0)];
    if(v==='row2')T=[mk(0,0),mk(l+2*c+0.1,0)];
    if(v==='col2')T=[mk(0,0),mk(0,w+2*c+0.1)];
    if(v==='island')T=[mk(0,0),mk(l,0),mk(0,w+0.0),mk(l,w)];
    e.target.value=''; renderTables(); update();
  };

  function ext(t){return t.r?{dx:t.w,dy:t.l}:{dx:t.l,dy:t.w}}
  function chairSize(){
    const mode=document.querySelector('input[name=mode]:checked').value;
    const v=num($('cs').value);
    return mode==='abs'?v:v*(T[0]?T[0].w:0);
  }
  function fit(len,c,g){
    if(c<=0||len<=0)return 0;
    return Math.max(0,Math.floor((len+g+E)/(c+g)));
  }
  const hit=(a,b)=>a.x<b.x+b.w-E&&b.x<a.x+a.w-E&&a.y<b.y+b.h-E&&b.y<a.y+a.h-E;

  function compute(auto){
    const c=chairSize(), g=num($('gap').value), tk=Math.min(1,Math.max(0,num($('tuck').value)))*c;
    const on=[$('s1').checked,$('s2').checked,$('s3').checked,$('s4').checked];
    const rects=T.map(t=>{const e=ext(t);return{x:t.x,y:t.y,w:e.dx,h:e.dy}});
    const chairs=[], per=T.map(()=>0);
    if(manual&&!auto){M.forEach(m=>chairs.push({x:m.x,y:m.y,w:m.w||c,h:m.h||c}));return{c,rects,chairs,per};}
    if(c<=0)return{c,rects,chairs,per};
    T.forEach((t,i)=>{
      const R=rects[i];
      const sides=[
        {on:on[0],len:R.w,pos:p=>({x:R.x+p,y:R.y-c+tk})},
        {on:on[1],len:R.w,pos:p=>({x:R.x+p,y:R.y+R.h-tk})},
        {on:on[2],len:R.h,pos:p=>({x:R.x-c+tk,y:R.y+p})},
        {on:on[3],len:R.h,pos:p=>({x:R.x+R.w-tk,y:R.y+p})}
      ];
      sides.forEach(s=>{
        if(!s.on)return;
        const n=fit(s.len,c,g), used=n*c+(n-1)*g, st=(s.len-used)/2;
        for(let k=0;k<n;k++){
          const q=s.pos(st+k*(c+g)), ch={x:q.x,y:q.y,w:c,h:c};
          if(rects.some((r,j)=>j!==i&&hit(ch,r))||chairs.some(o=>hit(ch,o)))continue;
          chair_push(ch,i);
        }
      });
    });
    function chair_push(ch,i){chairs.push(ch);per[i]++}
    return{c,rects,chairs,per};
  }

  function update(){
    $('cll').textContent=document.querySelector('input[name=mode]:checked').value==='abs'?'椅子の一辺':'比率（椅子 ÷ 1台目の幅）';
    const r=compute();
    $('tot').textContent=r.chairs.length;
    $('det').textContent='椅子一辺 '+(+r.c.toFixed(3))+' ／ '+(T.length>1?r.per.map((n,i)=>'テーブル'+(i+1)+': '+n+'脚').join('・'):'配置できた椅子の合計')+'（他のテーブルや椅子と重なる位置は除外）';
    if(manual)$('det').textContent='手動配置：椅子をクリックで選択 → 矢印キーで移動／Deleteで削除（椅子一辺 '+(+r.c.toFixed(3))+'）。赤枠は椅子どうしの重なり';
    $('manualbar').style.display=manual?'block':'none';
    const cm0=manual&&sel>=0&&M[sel];
    $('csz').style.display=cm0?'flex':'none';
    if(cm0){
      if(document.activeElement!==$('cw'))$('cw').value=+(M[sel].w||r.c).toFixed(3);
      if(document.activeElement!==$('ch'))$('ch').value=+(M[sel].h||r.c).toFixed(3);
    }
    draw(r);
    autosave();
  }

  function chairStroke(i,cs){
    if(manual&&i===sel)return 'stroke="var(--acc)" stroke-width="3"';
    if(manual&&cs.some((o,j)=>j!==i&&hit(cs[i],o)))return 'stroke="#d33" stroke-width="2"';
    return 'stroke="var(--bg)" stroke-width="1"';
  }
  function draw(r){
    const svg=$('svg'), VW=700, VH=420, pad=20;
    const all=r.rects.concat(r.chairs);
    if(!all.length||r.rects.some(t=>t.w<=0||t.h<=0)){svg.innerHTML='';return}
    const x0=Math.min(...all.map(a=>a.x)), y0=Math.min(...all.map(a=>a.y));
    const x1=Math.max(...all.map(a=>a.x+a.w)), y1=Math.max(...all.map(a=>a.y+a.h));
    const s=Math.min((VW-2*pad)/(x1-x0),(VH-2*pad)/(y1-y0));
    const ox=(VW-(x1-x0)*s)/2-x0*s, oy=(VH-(y1-y0)*s)/2-y0*s;
    let h='';
    r.chairs.forEach((c,ci)=>{
      h+='<rect x="'+(ox+c.x*s)+'" y="'+(oy+c.y*s)+'" width="'+c.w*s+'" height="'+c.h*s+'" rx="3" fill="var(--chair)" '+chairStroke(ci,r.chairs)+' data-idx="'+ci+'" style="cursor:'+(manual?'pointer':'default')+'"/>';
    });
    r.rects.forEach((t,i)=>{
      h+='<rect x="'+(ox+t.x*s)+'" y="'+(oy+t.y*s)+'" width="'+t.w*s+'" height="'+t.h*s+'" rx="4" fill="var(--tbl)" fill-opacity="'+($('seethru').checked?0.55:1)+'" '+(i===selT?'stroke="var(--acc)" stroke-width="3"':'stroke="var(--bg)" stroke-width="1"')+' data-tidx="'+i+'" style="cursor:pointer"/>';
      h+='<text x="'+(ox+(t.x+t.w/2)*s)+'" y="'+(oy+(t.y+t.h/2)*s+5)+'" text-anchor="middle" font-size="14" pointer-events="none" fill="var(--fg)">'+(i+1)+'</text>';
    });
    svg.innerHTML=h;
  }

  ['gap','tuck','seethru','cs','s1','s2','s3','s4'].forEach(i=>$(i).addEventListener('input',update));
  document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change',()=>{
    $('cs').value=r.value==='abs'?'0.5':'0.8'; update();
  }));
  renderTables(); const imp=()=>compute(true).chairs.map(a=>({x:+a.x.toFixed(3),y:+a.y.toFixed(3)}));
  document.querySelectorAll('input[name=place]').forEach(r=>r.addEventListener('change',()=>{
    manual=document.querySelector('input[name=place]:checked').value==='manual';
    if(manual&&!M.length)M=imp();
    sel=-1; update();
  }));
  $('imp').onclick=()=>{M=imp();sel=-1;update()};
  $('addc').onclick=()=>{const c=chairSize(),t=T[0];M.push({x:t.x,y:+(t.y-c).toFixed(3)});sel=M.length-1;update()};
  $('delc').onclick=()=>{if(sel>=0){M.splice(sel,1);sel=-1;update()}};
  $('svg').addEventListener('click',e=>{
    const dd=e.target.dataset||{};if(dd.tidx!==undefined){selT=+dd.tidx;sel=-1;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();renderTables();update();return;}if(!manual){selT=-1;update();return;}selT=-1;
    const i=e.target.dataset&&e.target.dataset.idx;
    sel=(i===undefined||i===null||i==='')?-1:+i;
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    update();
  });
  function mv(k){
    if(selT>=0&&T[selT]){const st2=num((manual?$('step'):$('step2')).value)||0.05;const t=T[selT];if(k==='L')t.x=+(t.x-st2).toFixed(3);if(k==='R')t.x=+(t.x+st2).toFixed(3);if(k==='U')t.y=+(t.y-st2).toFixed(3);if(k==='D')t.y=+(t.y+st2).toFixed(3);renderTables();update();return true;}
    if(!manual||sel<0||!M[sel])return false;
    const st=num($('step').value)||0.05;
    if(k==='L')M[sel].x=+(M[sel].x-st).toFixed(3);
    if(k==='R')M[sel].x=+(M[sel].x+st).toFixed(3);
    if(k==='U')M[sel].y=+(M[sel].y-st).toFixed(3);
    if(k==='D')M[sel].y=+(M[sel].y+st).toFixed(3);
    update(); return true;
  }
  $('manualbar').addEventListener('click',e=>{const k=e.target.dataset.mv;if(k)mv(k)});
  $('tpad').addEventListener('click',e=>{const k=e.target.dataset.mv;if(k)mv(k)});
  document.addEventListener('keydown',e=>{
    const tg=e.target, tag=tg.tagName;
    if(tag==='SELECT'||tag==='TEXTAREA'||(tag==='INPUT'&&tg.type==='number'))return;
    const map={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'};
    if(map[e.key]){if(mv(map[e.key]))e.preventDefault();}
    else if((e.key==='Delete'||e.key==='Backspace')&&manual&&sel>=0){e.preventDefault();M.splice(sel,1);sel=-1;update();}
  });
  $('cw').addEventListener('input',()=>{if(M[sel]){const v=num($('cw').value);if(v>0){M[sel].w=v;update()}}});
  $('ch').addEventListener('input',()=>{if(M[sel]){const v=num($('ch').value);if(v>0){M[sel].h=v;update()}}});
  $('crs').onclick=()=>{if(M[sel]){delete M[sel].w;delete M[sel].h;update()}};

  const jmsg=t=>{$('jmsg').textContent=t};
  function load(s){
    T=(s.tables||[]).map(t=>({w:num(t.w)||0.6,l:num(t.l)||1.7,x:num(t.x),y:num(t.y),r:t.r?90:0}));
    if(!T.length)T=[{w:0.6,l:1.7,x:0,y:0,r:0}];
    const cm=s.chair||{};
    document.querySelector('input[name=mode][value='+(cm.mode==='ratio'?'ratio':'abs')+']').checked=true;
    $('cs').value=cm.value!==undefined?num(cm.value):0.5;
    $('gap').value=num(s.gap); $('tuck').value=num(s.tuck); $('seethru').checked=!!s.seethru;
    (s.sides||[true,true,false,false]).forEach((v,i)=>{if($('s'+(i+1)))$('s'+(i+1)).checked=!!v});
    M=(s.chairs||[]).map(m=>{const o={x:num(m.x),y:num(m.y)};if(m.w>0)o.w=+m.w;if(m.h>0)o.h=+m.h;return o});
    manual=!!s.manual;
    document.querySelector('input[name=place][value='+(manual?'manual':'auto')+']').checked=true;
    sel=-1; selT=-1; renderTables(); update();
  }
  $('jsave').onclick=()=>{
    const s={app:'chair-calc',version:1,tables:T,
      chair:{mode:document.querySelector('input[name=mode]:checked').value,value:num($('cs').value)},
      gap:num($('gap').value),tuck:num($('tuck').value),seethru:$('seethru').checked,
      sides:[$('s1').checked,$('s2').checked,$('s3').checked,$('s4').checked],
      manual:manual,chairs:M};
    $('json').value=JSON.stringify(s,null,1);
    jmsg('JSONを作成しました。コピーしてメモなどに保存してください。');
  };
  $('jcopy').onclick=async()=>{
    const ta=$('json'); if(!ta.value)$('jsave').click();
    try{await navigator.clipboard.writeText(ta.value);jmsg('コピーしました。')}
    catch(e){ta.select();try{document.execCommand('copy');jmsg('コピーしました。')}catch(_){jmsg('選択された文字を手動でコピーしてください。')}}
  };
  $('jload').onclick=()=>{
    try{const s=JSON.parse($('json').value);load(s);jmsg('読み込みました。')}
    catch(e){jmsg('読み込めませんでした。JSONの形式を確認してください。')}
  };

  const SK='chair-calc-v1';
  let saveTimer=0;
  function snapshot(){
    return {app:'chair-calc',version:1,tables:T,
      chair:{mode:document.querySelector('input[name=mode]:checked').value,value:num($('cs').value)},
      gap:num($('gap').value),tuck:num($('tuck').value),seethru:$('seethru').checked,
      sides:[$('s1').checked,$('s2').checked,$('s3').checked,$('s4').checked],
      manual:manual,chairs:M};
  }
  function ckSet(str){
    try{
      if(str.length>3500)return 'big';
      document.cookie=SK+'='+encodeURIComponent(str)+'; max-age=31536000; path=/; SameSite=Lax';
      return document.cookie.indexOf(SK+'=')>=0?'ok':'ng';
    }catch(e){return 'ng'}
  }
  function ckGet(){
    try{const m=document.cookie.split('; ').find(x=>x.indexOf(SK+'=')===0);return m?decodeURIComponent(m.slice(SK.length+1)):null}catch(e){return null}
  }
  function autosave(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const str=JSON.stringify(snapshot());
      let ls=false;
      try{localStorage.setItem(SK,str);ls=true}catch(e){}
      const ck=ckSet(str), p=[];
      if(ls)p.push('ブラウザ保存（localStorage）に保存');
      if(ck==='ok')p.push('クッキーにも保存');
      else if(ck==='big')p.push('クッキーは容量超過（約3.5KB超）のため未保存');
      else p.push('クッキーはこの環境では使えませんでした');
      $('amsg').textContent='自動保存：'+(ls||ck==='ok'?p.join('・'):'保存できませんでした（この環境では無効）');
    },400);
  }
  $('aclr').onclick=()=>{
    try{localStorage.removeItem(SK)}catch(e){}
    try{document.cookie=SK+'=; max-age=0; path=/'}catch(e){}
    $('amsg').textContent='保存データを消しました（次の操作でまた自動保存されます）。';
  };
  (function(){
    let s=null;
    try{s=localStorage.getItem(SK)}catch(e){}
    if(!s)s=ckGet();
    if(s){try{load(JSON.parse(s))}catch(e){}}
  })();

    update();
})();
</script>
</body>
</html>
